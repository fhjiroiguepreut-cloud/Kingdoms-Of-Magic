
name: Compilar Kingdoms of Magic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Godot y Android
        run: |
          mkdir -p ~/.config
          mkdir -p ~/.local/share/godot/export_templates

          cp -r /root/.config/godot ~/.config/ || true

          cp -r /root/.local/share/godot/export_templates/4.3.stable \
            ~/.local/share/godot/export_templates/ || true

          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            >> ~/.config/godot/editor_settings-4.3.tres

      - name: Comprobar proyecto
        run: |
          test -f KingdomsOfMagic/project.godot
          test -f KingdomsOfMagic/export_presets.cfg

      - name: Importar recursos
        run: |
          godot --headless --path KingdomsOfMagic --editor --quit

      - name: Compilar APK
        run: |
          mkdir -p KingdomsOfMagic/build
          godot --headless --path KingdomsOfMagic \
            --export-debug "Android" \
            KingdomsOfMagic/build/KingdomsOfMagic.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: KingdomsOfMagic-APK
          path: KingdomsOfMagic/build/KingdomsOfMagic.apk
