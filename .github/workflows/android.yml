name: Compilar Kingdoms of Magic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Construir APK Android
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      # 1. Descargar el repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Encontrar automáticamente project.godot
      - name: Buscar proyecto Godot
        shell: bash
        run: |
          PROJECT_FILE=$(find . \
            -type f \
            -name "project.godot" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró project.godot"
            echo "Archivos disponibles:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado: $PROJECT_DIR"

      # 3. Comprobar configuración Android
      - name: Comprobar configuración
        shell: bash
        run: |
          echo "Comprobando archivos..."

          test -f "$PROJECT_DIR/project.godot"

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: Falta export_presets.cfg"
            echo "Debes crear un preset Android en Godot."
            exit 1
          fi

          if ! grep -q 'name="Android"' "$PROJECT_DIR/export_presets.cfg"; then
            echo "ERROR: El preset debe llamarse Android"
            exit 1
          fi

          echo "Configuración encontrada."

      # 4. Comprobar Godot
      - name: Comprobar Godot
        run: |
          godot --version

      # 5. Importar recursos
      - name: Importar recursos
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      # 6. Crear APK
      - name: Compilar APK
        run: |
          mkdir -p "$PROJECT_DIR/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/KingdomsOfMagic.apk"

      # 7. Comprobar APK
      - name: Verificar APK
        run: |
          if [ ! -s "$PROJECT_DIR/build/KingdomsOfMagic.apk" ]; then
            echo "ERROR: No se generó el APK."
            exit 1
          fi

          echo "APK generado correctamente."
          ls -lh "$PROJECT_DIR/build/KingdomsOfMagic.apk"

      # 8. Guardar APK para descargarlo
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kingdoms-of-Magic-Android
          path: ${{ env.PROJECT_DIR }}/build/KingdomsOfMagic.apk
          if-no-files-found: error
          retention-days: 7
