name: Build Kingdoms Of Magic
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar plantillas de exportación
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Importar proyecto
        run: godot --headless --import || true

      - name: Exportar Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/KingdomsOfMagic.exe

      - name: Exportar Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/KingdomsOfMagic.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsOfMagic-windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsOfMagic-linux
          path: build/linux
