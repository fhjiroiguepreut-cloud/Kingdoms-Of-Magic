name: Build Kingdoms Of Magic

on:
  push:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir si hace falta
        run: |
          ls -la
          if [ ! -f project.godot ]; then
            mkdir -p /tmp/proj
            for z in *.zip; do unzip -oq "$z" -d /tmp/proj; done
            P=$(find /tmp/proj -name project.godot -not -path '*/__MACOSX/*' | head -n 1)
            echo "project.godot encontrado en: $P"
            test -n "$P"
            cp -r "$(dirname "$P")"/. .
          fi
          test -f project.godot
          ls -la

      - name: Crear presets
        run: |
          printf '%s\n' \
          '[preset.0]' \
          'name="Windows Desktop"' \
          'platform="Windows Desktop"' \
          'runnable=true' \
          'export_filter="all_resources"' \
          'include_filter=""' \
          'exclude_filter=""' \
          'export_path="build/windows/KingdomsOfMagic.exe"' \
          '[preset.0.options]' \
          'binary_format/embed_pck=true' \
          'binary_format/architecture="x86_64"' \
          'texture_format/s3tc_bptc=true' \
          '[preset.1]' \
          'name="Linux"' \
          'platform="Linux"' \
          'runnable=true' \
          'export_filter="all_resources"' \
          'include_filter=""' \
          'exclude_filter=""' \
          'export_path="build/linux/KingdomsOfMagic.x86_64"' \
          '[preset.1.options]' \
          'binary_format/embed_pck=true' \
          'binary_format/architecture="x86_64"' \
          'texture_format/s3tc_bptc=true' \
          > export_presets.cfg

      - name: Preparar
        run: |
          chmod -R a+rwX .
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          godot --headless --import || true

      - name: Exportar
        run: |
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows Desktop" build/windows/KingdomsOfMagic.exe
          godot --headless --export-release "Linux" build/linux/KingdomsOfMagic.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsOfMagic-windows
          path: build/windows

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsOfMagic-linux
          path: build/linux
