name: Build Kingdoms Of Magic (Android)

on:
  push:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          ls -la
          if [ ! -f project.godot ]; then
            mkdir -p /tmp/proj
            for z in *.zip; do unzip -oq "$z" -d /tmp/proj; done
            P=$(find /tmp/proj -name project.godot -not -path '*/__MACOSX/*' | head -n 1)
            echo "project.godot encontrado en: $P"
            test -n "$P"
            cp -r "$(dirname "$P")"/. .
          fi
          test -f project.godot
          test -f export_presets.cfg
          ls -la

      - name: Preparar Godot y Android
        run: |
          chmod -R a+rwX .
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot -v -e --quit --headless || true
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo 'export/android/debug_keystore = "/root/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
          } > ~/.config/godot/editor_settings-4.tres

      - name: Importar proyecto
        run: godot --headless --import || true

      - name: Exportar APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/KingdomsOfMagic.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomsOfMagic-android
          path: build/android/KingdomsOfMagic.apk
